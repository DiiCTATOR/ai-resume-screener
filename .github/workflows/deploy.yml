name: Build and deploy to AWS EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-resume-screener-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend_ai/package-lock.json
            mern_ai/package-lock.json

      - name: Install dependencies
        run: npm run install:all

      - name: Build frontend
        run: npm run build

      - name: Verify build output
        run: test -f backend_ai/build/index.html

  deploy:
    name: Deploy to EC2
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -eu

            APP_DIR="$HOME/ai-resume-screener"

            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/DiiCTATOR/ai-resume-screener.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git pull --ff-only origin main

            # Create templates on first deploy. Replace their placeholder values
            # with real credentials on EC2 before the application is used.
            [ -f backend_ai/.env ] || cp backend_ai/.env.example backend_ai/.env
            [ -f mern_ai/.env ] || cp mern_ai/.env.example mern_ai/.env

            npm run install:all
            npm run build

            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install --global pm2
            fi

            pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js
            pm2 save
            pm2 status

