
name: Build and Deploy AI Resume Screener to AWS EC2

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-resume-screener-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # JOB 1: BUILD AND VERIFY ON EC2
  # ==========================================

  build:
    name: Build Application on EC2
    runs-on: [self-hosted, linux, x64]

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check EC2 Environment
        run: |
          set -euo pipefail
          whoami
          node --version
          npm --version
          git --version
          df -h
          free -h

      - name: Install Dependencies
        run: |
          set -euo pipefail
          npm run install:all

      - name: Build Frontend
        run: |
          set -euo pipefail
          npm run build

      - name: Verify Build Output
        run: |
          set -euo pipefail

          if [ ! -f backend_ai/build/index.html ]; then
            echo "Frontend build output missing!"
            exit 1
          fi

          echo "Build successful."

  # ==========================================
  # JOB 2: DEPLOY ON SAME EC2 RUNNER
  # ==========================================

  deploy:
    name: Deploy Application on EC2
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: [self-hosted, linux, x64]

    steps:

      - name: Check Deployment Environment
        run: |
          set -euo pipefail
          whoami
          pwd
          pm2 --version || true

      - name: Verify Application Directory
        run: |
          set -euo pipefail

          APP_DIR="/home/ubuntu/ai-resume-screener"

          if [ ! -d "$APP_DIR/.git" ]; then
            echo "Application repository not found!"
            exit 1
          fi

      - name: Pull Latest Code
        run: |
          set -euo pipefail

          cd /home/ubuntu/ai-resume-screener

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Configure Environment
        run: |
          set -euo pipefail

          cd /home/ubuntu/ai-resume-screener

          test -f backend_ai/.env || {
            echo "ERROR: backend_ai/.env is missing."
            exit 1
          }

          chmod 600 backend_ai/.env

          if [ -f mern_ai/.env ]; then
            chmod 600 mern_ai/.env
          fi

      - name: Install Application Dependencies
        run: |
          set -euo pipefail

          cd /home/ubuntu/ai-resume-screener

          npm run install:all

      - name: Build Production Frontend
        run: |
          set -euo pipefail

          cd /home/ubuntu/ai-resume-screener

          npm run build

          test -f backend_ai/build/index.html

      - name: Check PM2
        run: |
          set -euo pipefail

          if ! command -v pm2 >/dev/null 2>&1; then
            npm install -g pm2
          fi

      - name: Start or Reload Application
        run: |
          set -euo pipefail

          cd /home/ubuntu/ai-resume-screener

          test -f ecosystem.config.js

          pm2 startOrReload ecosystem.config.js --update-env

          pm2 save

      - name: Application Health Check
        run: |
          set -euo pipefail

          echo "Checking application health..."

          for i in {1..12}; do
            if curl -fsS \
              http://127.0.0.1:4000/api/health; then

              echo "Application is healthy."
              exit 0
            fi

            echo "Attempt $i failed. Retrying..."
            sleep 5
          done

          echo "Application health check failed."

          pm2 logs ai-resume-screener \
            --lines 50 \
            --nostream || true

          exit 1

      - name: Deployment Status
        run: |
          echo "=================================="
          echo "AI RESUME SCREENER DEPLOYED"
          echo "=================================="

          pm2 status
