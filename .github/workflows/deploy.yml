
name: Build and Deploy AI Resume Screener to AWS EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-resume-screener-deployment
  cancel-in-progress: false

jobs:

  # ==========================================
  # JOB 1: BUILD APPLICATION ON AWS EC2
  # ==========================================

  build:
    name: Build Application
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend_ai/package-lock.json
            mern_ai/package-lock.json

      - name: Check Node and NPM Versions
        run: |
          node --version
          npm --version

      - name: Install Dependencies
        run: npm run install:all

      - name: Build Frontend
        run: npm run build

      - name: Verify Build Output
        run: |
          if [ ! -f backend_ai/build/index.html ]; then
            echo "ERROR: Frontend build output not found!"
            exit 1
          fi

          echo "Frontend build verified successfully."

  # ==========================================
  # JOB 2: DEPLOY APPLICATION ON AWS EC2
  # ==========================================

  deploy:
    name: Deploy Application
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Check EC2 Environment
        run: |
          set -euo pipefail
          whoami
          pwd
          node --version
          npm --version
          git --version
          pm2 --version

      - name: Check Application Directory
        run: |
          set -euo pipefail
          APP_DIR="/home/ubuntu/ai-resume-screener"

          if [ ! -d "$APP_DIR/.git" ]; then
            echo "ERROR: Project repository not found."
            exit 1
          fi

          echo "Application directory verified."

      - name: Pull Latest Repository Changes
        run: |
          set -euo pipefail
          cd /home/ubuntu/ai-resume-screener

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          echo "Repository updated successfully."

      - name: Verify Environment Files
        run: |
          set -euo pipefail
          cd /home/ubuntu/ai-resume-screener

          if [ ! -f backend_ai/.env ]; then
            echo "ERROR: backend_ai/.env is missing."
            exit 1
          fi

          if [ ! -f mern_ai/.env ]; then
            echo "ERROR: mern_ai/.env is missing."
            exit 1
          fi

          echo "Environment files verified."

      - name: Install Application Dependencies
        run: |
          set -euo pipefail
          cd /home/ubuntu/ai-resume-screener

          npm run install:all

          echo "Dependencies installed."

      - name: Build Frontend
        run: |
          set -euo pipefail
          cd /home/ubuntu/ai-resume-screener

          npm run build

          test -f backend_ai/build/index.html

          echo "Frontend build completed."

      - name: Check PM2
        run: |
          set -euo pipefail

          if ! command -v pm2 >/dev/null 2>&1; then
            sudo npm install --global pm2
          fi

          pm2 --version

      - name: Start or Reload Application
        run: |
          set -euo pipefail
          cd /home/ubuntu/ai-resume-screener

          if [ ! -f ecosystem.config.js ]; then
            echo "ERROR: ecosystem.config.js missing."
            exit 1
          fi

          pm2 startOrReload ecosystem.config.js --update-env
          pm2 save

      - name: Verify Application Health
        run: |
          set -euo pipefail

          sleep 5

          if ! curl -fsS http://127.0.0.1:4000/api/health; then
            echo "ERROR: Application health check failed."

            pm2 logs ai-resume-screener --lines 50 --nostream

            exit 1
          fi

          echo "Application health check passed."

      - name: Deployment Completed
        run: |
          echo "===================================="
          echo "AI RESUME SCREENER DEPLOYED"
          echo "===================================="

          pm2 status
