
name: Deploy AI Resume Screener

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-resume-screener-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy on EC2
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30

    env:
      APP_DIR: /home/ubuntu/ai-resume-screener
      DEPS_MARKER: /home/ubuntu/.cache/ai-resume-screener-deps.sha256
      NODE_OPTIONS: --max-old-space-size=384

    steps:
      - name: Sync application source
        run: |
          set -e
          cd "$APP_DIR"
          git fetch --prune origin main
          git reset --hard origin/main

      - name: Verify deployment configuration
        run: |
          set -e
          cd "$APP_DIR"

          test -f backend_ai/.env
          test -f ecosystem.config.js
          test -f backend_ai/package-lock.json
          test -f mern_ai/package-lock.json

          echo "Deployment files verified."

      - name: Install dependencies only when required
        run: |
          set -e
          cd "$APP_DIR"

          CURRENT_HASH=$(
            sha256sum \
              package.json \
              backend_ai/package.json \
              backend_ai/package-lock.json \
              mern_ai/package.json \
              mern_ai/package-lock.json \
              | sha256sum | awk '{print $1}'
          )

          SAVED_HASH=$(cat "$DEPS_MARKER" 2>/dev/null || true)

          if [ "$CURRENT_HASH" = "$SAVED_HASH" ] \
            && [ -d backend_ai/node_modules ] \
            && [ -x mern_ai/node_modules/.bin/vite ]; then
            echo "Dependencies unchanged. Skipping installation."
          else
            AVAILABLE_KB=$(df -Pk "$APP_DIR" | awk 'NR==2 {print $4}')

            if [ "$AVAILABLE_KB" -lt 1048576 ]; then
              echo "ERROR: Less than 1 GB disk space available."
              echo "Free disk space before installing dependencies."
              exit 1
            fi

            echo "Installing backend dependencies..."
            npm ci --prefix backend_ai --no-audit --no-fund --maxsockets=1

            echo "Installing frontend dependencies..."
            npm ci --prefix mern_ai --no-audit --no-fund --maxsockets=1

            printf '%s\n' "$CURRENT_HASH" > "$DEPS_MARKER"
          fi

      - name: Build frontend
        run: |
          set -e
          cd "$APP_DIR"

          npm run build

          test -f backend_ai/build/index.html
          echo "Frontend build completed."

      - name: Reload application with PM2
        run: |
          set -e
          cd "$APP_DIR"

          command -v pm2

          pm2 startOrReload ecosystem.config.js --update-env
          pm2 save
          pm2 status

      - name: Verify application health
        run: |
          set -e
          cd "$APP_DIR"

          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 5 \
              http://127.0.0.1:4000/api/health; then
              echo
              echo "Deployment successful. Health check passed."
              exit 0
            fi

            echo "Health check attempt $attempt failed. Retrying..."
            sleep 3
          done

          echo "ERROR: Application health check failed."
          pm2 status
          pm2 logs --lines 50 --nostream || true
          exit 1
