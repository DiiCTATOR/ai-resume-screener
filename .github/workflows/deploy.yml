name: Deploy AI Resume Screener

on:
  push:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    shell: bash -l {0}

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ensure Node and NPM in PATH
        run: |
          for p in /usr/local/bin /usr/bin $(find /home/ubuntu/.nvm/versions/node -maxdepth 2 -name bin 2>/dev/null); do
            if [ -x "$p/node" ]; then
              echo "$p" >> "$GITHUB_PATH"
              echo "Exported $p to PATH"
            fi
          done

      - name: Install & Lint
        run: |
          npm --prefix mern_ai install
          npm --prefix mern_ai run lint

      - name: Install & Build
        run: |
          npm --prefix backend_ai install
          npm run build

      - name: Deploy with PM2
        run: |
          pm2 startOrReload ecosystem.config.js --update-env
          pm2 save
